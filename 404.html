<!DOCTYPE html>
<html class="h-full">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link rel="icon" href="images/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="h-full bg-[#05060b]">
    <header class="fixed inset-x-0 top-4 z-50 px-4">
      <div
        class="mx-auto flex h-16 max-w-7xl items-center rounded-2xl border border-white/[0.08] bg-[#0b101b]/75 px-4 shadow-[0_10px_40px_rgba(0,0,0,0.25)] backdrop-blur-2xl sm:rounded-3xl sm:px-5"
      >
        <a href="/" class="group flex items-center gap-3">
          <span
            class="relative flex h-11 w-11 items-center justify-center overflow-hidden rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 p-[1px] shadow-lg shadow-violet-500/10 transition duration-500 group-hover:scale-105"
          >
            <span
              class="flex h-full w-full items-center justify-center rounded-[0.95rem] bg-[#090d17]"
            >
              <img src="images/logo.png" class="h-8 w-8 object-contain" />
            </span>
          </span>

          <div>
            <p
              class="text-sm font-semibold tracking-[-0.02em] text-white transition-colors group-hover:text-violet-100"
            >
              Ayush Pai
            </p>
          </div>
        </a>
      </div>
    </header>

    <main class="relative isolate min-h-full overflow-hidden">
      <img
        src="https://images.unsplash.com/photo-1583585635793-0e1894c169bd?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1825&q=80"
        alt=""
        class="absolute inset-0 -z-20 h-full w-full object-cover"
      />

      <div
        class="inset-0 -z-10 bg-[#05060b]/70 backdrop-blur-[2px]"
      ></div>

      <div
        class="mx-auto max-w-7xl px-6 py-32 text-center sm:py-40 lg:px-8"
      >

        <p class="mt-10 text-base font-semibold text-violet-300">
          404
        </p>

        <h1
          class="mt-4 text-5xl font-bold tracking-tight text-white sm:text-7xl"
        >
          Page not found
        </h1>

        <p class="mt-6 text-lg text-white/70 sm:text-xl">
          The page you are looking for does not exist or has been moved
        </p>

        <div class="mt-10 flex flex-wrap justify-center gap-4">
          <a
            href="/"
            class="rounded-2xl border border-white/20 bg-white/10 px-8 py-3 text-white backdrop-blur transition hover:scale-105 hover:bg-white/20"
          >
            ← Back Home
          </a>
        </div>
      </div>
    </main>
  </body>
</html>

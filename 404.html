<!doctype html>
<html class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayush Pai | 404 - Page Not Found</title>
    <link rel="icon" href="images/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="h-full bg-[#05060b]">
    <main class="relative isolate min-h-full overflow-hidden">
      <img
        src="https://images.unsplash.com/photo-1583585635793-0e1894c169bd?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1825&q=80"
        alt=""
        class="absolute inset-0 -z-20 h-full w-full object-cover"
      />

      <div class="inset-0 -z-10 bg-[#05060b]/70 backdrop-blur-[2px]"></div>

      <div class="mx-auto max-w-7xl px-6 py-32 text-center sm:py-40 lg:px-8">
        <p class="mt-10 text-base font-semibold text-violet-300">404</p>

        <h1
          class="mt-4 text-5xl font-bold tracking-tight text-white sm:text-7xl"
        >
          Page not found
        </h1>

        <p class="mt-6 text-lg text-white/70 sm:text-xl">
          The page you are looking for does not exist or has been moved
        </p>

        <div class="mt-10 flex justify-center gap-4 flex-wrap">
          <a
            href="/"
            class="px-8 py-3 rounded-2xl bg-white/10 border border-white/20 text-white backdrop-blur hover:bg-white/20 hover:scale-105 transition"
          >
            ← Back Home
          </a>
        </div>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayush Pai</title>
    <link rel="icon" href="images/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-[#02040a] font-sans text-white antialiased selection:bg-violet-500/30 selection:text-white"
  >
    <div
      id="progress"
      class="fixed left-0 top-0 z-[999999] h-[2px] w-0 bg-gradient-to-r from-violet-500 via-fuchsia-400 to-violet-300 shadow-[0_0_12px_rgba(139,92,246,.7)]"
    ></div>

    <div
      class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(circle_at_75%_0%,rgba(124,58,237,0.13),transparent_30%),radial-gradient(circle_at_15%_85%,rgba(37,99,235,0.08),transparent_28%),linear-gradient(180deg,#02040a_0%,#030711_100%)]"
    ></div>

    <div
      class="pointer-events-none fixed inset-0 -z-10 opacity-[0.025] bg-[linear-gradient(rgba(255,255,255,0.5)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.5)_1px,transparent_1px)] bg-[size:48px_48px]"
    ></div>

    <div class="min-h-screen lg:pr-[360px]">
      <header class="fixed left-0 right-0 top-4 z-50 px-4 lg:right-[360px]">
        <div
          class="mx-auto flex h-[4.25rem] max-w-6xl items-center justify-between rounded-[1.4rem] border border-white/[0.08] bg-[#080d17]/80 px-4 shadow-[0_18px_60px_rgba(0,0,0,0.32)] backdrop-blur-2xl sm:px-5"
        >
          <a
            href="/"
            aria-label="Ayush Pai home"
            class="group flex items-center gap-3"
          >
            <span
              class="relative flex h-11 w-11 items-center justify-center overflow-hidden rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 p-[1px] shadow-lg shadow-violet-500/10 transition duration-500 group-hover:scale-105"
            >
              <span
                class="flex h-full w-full items-center justify-center rounded-[0.95rem] bg-[#090d17]"
              >
                <img
                  src="images/logo.png"
                  alt="Ayush Pai"
                  class="h-8 w-8 object-contain"
                />
              </span>
            </span>

            <div>
              <p
                class="text-sm font-semibold tracking-[-0.02em] text-white transition-colors group-hover:text-violet-100"
              >
                Ayush Pai
              </p>
            </div>
          </a>

          <button
            type="button"
            data-focus-command
            aria-label="Focus command palette"
            class="group flex h-10 items-center gap-2 rounded-xl border border-white/[0.08] bg-white/[0.025] px-3 text-slate-500 transition duration-300 hover:border-violet-400/20 hover:bg-violet-500/[0.06] hover:text-white"
          >
            <span class="text-xs">⌘</span>
            <span class="text-[11px]">K</span>
          </button>
        </div>
      </header>

      <main
        class="mx-auto flex min-h-screen w-full max-w-2xl flex-col justify-center gap-3 px-4 pb-32 pt-32 sm:px-6 lg:mr-auto lg:px-8"
      >
        <a
          href="https://github.com/ayushkpai"
          target="_blank"
          rel="noopener noreferrer"
          class="group flex w-full items-center justify-between rounded-2xl border border-white/[0.07] bg-white/[0.025] p-5 transition-all duration-300 hover:-translate-y-0.5 hover:border-violet-400/20 hover:bg-violet-500/[0.06]"
        >
          <div>
            <p class="text-sm font-medium text-white">GitHub</p>

            <p class="mt-1 text-[11px] text-slate-500">ayushkpai</p>
          </div>

          <span
            class="text-emerald-300/70 transition-all duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 group-hover:text-emerald-200"
          >
            ↗
          </span>
        </a>

        <a
          href="https://github.com/paiandco"
          target="_blank"
          rel="noopener noreferrer"
          class="group flex w-full items-center justify-between rounded-2xl border border-white/[0.07] bg-white/[0.025] p-5 transition-all duration-300 hover:-translate-y-0.5 hover:border-violet-400/20 hover:bg-violet-500/[0.06]"
        >
          <div>
            <p
              class="text-sm font-medium text-white transition-colors group-hover:text-emerald-100"
            >
              Pai &amp; Co
            </p>

            <p class="mt-1 text-[11px] text-slate-500">paiandco</p>
          </div>

          <span
            class="text-emerald-300/70 transition-all duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 group-hover:text-emerald-200"
          >
            ↗
          </span>
        </a>

        <a
          href="/retro-grand-prix"
          class="group flex w-full items-center justify-between rounded-2xl border border-white/[0.07] bg-white/[0.025] p-5 transition-all duration-300 hover:-translate-y-0.5 hover:border-violet-400/20 hover:bg-violet-500/[0.06]"
        >
          <div>
            <p
              class="text-sm font-medium text-white transition-colors group-hover:text-red-100"
            >
              Retro Grand Prix
            </p>

            <p class="mt-1 text-[11px] text-slate-500">F1 Racing</p>
          </div>

          <span
            class="text-emerald-300/70 transition-all duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 group-hover:text-emerald-200"
          >
            →
          </span>
        </a>
      </main>

      <section
        id="command"
        class="fixed bottom-6 left-1/2 z-[200] w-[min(620px,calc(100vw-2rem))] -translate-x-1/2"
      >
        <div
          class="overflow-hidden rounded-[1.5rem] border border-white/[0.09] bg-[#080d17]/95 shadow-[0_25px_100px_rgba(0,0,0,.55)] backdrop-blur-2xl"
        >
          <div
            class="flex items-center gap-3 border-b border-white/[0.07] px-5"
          >
            <span class="text-lg text-slate-500">⌕</span>

            <input
              id="commandInput"
              type="text"
              placeholder="Search"
              autocomplete="off"
              class="h-14 flex-1 bg-transparent text-sm text-white outline-none placeholder:text-slate-600"
            />

            <kbd
              class="rounded-lg border border-white/10 bg-white/[0.04] px-2 py-1 text-[10px] text-slate-500"
            >
              ⌘ K
            </kbd>
          </div>

          <div id="commandItems" class="hidden max-h-72 overflow-y-auto p-2">
            <a
              href="https://github.com/ayushkpai"
              target="_blank"
              rel="noopener noreferrer"
              data-command-item
              data-search="github ayushkpai open source"
              class="flex items-center justify-between rounded-xl px-4 py-3 text-sm text-slate-300 transition hover:bg-white/[0.06] hover:text-white"
            >
              <div>
                <span>GitHub</span>

                <p class="mt-1 text-[10px] text-slate-600">ayushkpai</p>
              </div>

              <span class="text-slate-600">↗</span>
            </a>

            <a
              href="https://github.com/paiandco"
              target="_blank"
              rel="noopener noreferrer"
              data-command-item
              data-search="pai co paiandco github"
              class="flex items-center justify-between rounded-xl px-4 py-3 text-sm text-slate-300 transition hover:bg-white/[0.06] hover:text-white"
            >
              <div>
                <span>Pai &amp; Co</span>

                <p class="mt-1 text-[10px] text-slate-600">paiandco</p>
              </div>

              <span class="text-slate-600">↗</span>
            </a>

            <a
              href="/retro-grand-prix"
              data-command-item
              data-search="retro grand prix f1 racing game"
              class="flex w-full items-center justify-between rounded-xl px-4 py-3 text-left text-sm text-slate-300 transition hover:bg-white/[0.06] hover:text-white"
            >
              <div>
                <span>Retro Grand Prix</span>

                <p class="mt-1 text-[10px] text-slate-600">F1 Racing</p>
              </div>

              <span class="text-red-300/70">→</span>
            </a>
          </div>
        </div>
      </section>
    </div>

    <script>
      const commandInput = document.getElementById("commandInput");
      const commandItemsContainer = document.getElementById("commandItems");
      const commandItems = [
        ...document.querySelectorAll("[data-command-item]"),
      ];
      const progress = document.getElementById("progress");

      let selectedIndex = 0;

      function showCommandResults() {
        commandItemsContainer.classList.remove("hidden");
      }

      function hideCommandResults() {
        if (!commandInput.value.trim()) {
          commandItemsContainer.classList.add("hidden");
        }
      }

      function getVisibleItems() {
        return commandItems.filter(
          (item) => !item.classList.contains("hidden"),
        );
      }

      function updateSelection() {
        const visibleItems = getVisibleItems();

        commandItems.forEach((item) => {
          item.classList.remove(
            "bg-violet-500/10",
            "text-white",
            "ring-1",
            "ring-violet-400/20",
          );
        });

        if (!visibleItems.length) {
          selectedIndex = 0;
          return;
        }

        if (selectedIndex >= visibleItems.length) {
          selectedIndex = 0;
        }

        visibleItems[selectedIndex].classList.add(
          "bg-violet-500/10",
          "text-white",
          "ring-1",
          "ring-violet-400/20",
        );
      }

      function focusCommand() {
        commandInput.focus();
        commandInput.select();
        showCommandResults();
        updateSelection();
      }

      function selectCommand() {
        const visibleItems = getVisibleItems();

        if (!visibleItems.length) return;

        visibleItems[selectedIndex].click();
      }

      document.querySelectorAll("[data-focus-command]").forEach((button) => {
        button.addEventListener("click", focusCommand);
      });

      commandInput.addEventListener("focus", showCommandResults);

      commandInput.addEventListener("input", () => {
        const query = commandInput.value.toLowerCase().trim();

        showCommandResults();

        commandItems.forEach((item) => {
          const search = item.dataset.search.toLowerCase();

          item.classList.toggle(
            "hidden",
            query.length > 0 && !search.includes(query),
          );
        });

        selectedIndex = 0;
        updateSelection();
      });

      commandInput.addEventListener("keydown", (event) => {
        const visibleItems = getVisibleItems();

        if (event.key === "ArrowDown") {
          event.preventDefault();

          if (visibleItems.length) {
            selectedIndex = (selectedIndex + 1) % visibleItems.length;

            updateSelection();
          }
        }

        if (event.key === "ArrowUp") {
          event.preventDefault();

          if (visibleItems.length) {
            selectedIndex =
              (selectedIndex - 1 + visibleItems.length) % visibleItems.length;

            updateSelection();
          }
        }

        if (event.key === "Enter") {
          event.preventDefault();
          selectCommand();
        }

        if (event.key === "Escape") {
          commandInput.blur();
          commandInput.value = "";

          commandItems.forEach((item) => {
            item.classList.remove("hidden");
          });

          hideCommandResults();
          updateSelection();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (
          (event.metaKey || event.ctrlKey) &&
          event.key.toLowerCase() === "k"
        ) {
          event.preventDefault();
          focusCommand();
        }

        if (event.key === "Escape" && !commandInput.matches(":focus")) {
          commandInput.blur();
        }
      });

      window.addEventListener(
        "scroll",
        () => {
          const height =
            document.documentElement.scrollHeight - window.innerHeight;

          progress.style.width =
            height > 0 ? `${(window.scrollY / height) * 100}%` : "0%";
        },
        { passive: true },
      );
    </script>
  </body>
</html>

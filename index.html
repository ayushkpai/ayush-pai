<!doctype html>

  <body

    <div

            <span

              <img

            </span>
          </span>

          <div>
            <p

            <p

        <div class="flex items-center gap-2">

          <button
            type="button"
            data-open-offcanvas

            class="group flex h-10 w-10 items-center justify-center rounded-xl border border-white/[0.08] bg-white/[0.025] text-slate-400 transition duration-300 hover:border-white/20 hover:bg-white/[0.07] hover:text-white"

            <span class="flex flex-col gap-1">
              <span

          <div class="grid gap-5 md:grid-cols-2">
            <a
              href="https://github.com/ayushkpai"
              target="_blank"
              rel="noopener noreferrer"
              class="group relative min-h-[320px] overflow-hidden rounded-[2rem] border border-white/[0.08] bg-white/[0.025] p-10 shadow-[0_30px_100px_rgba(0,0,0,0.3)] transition-all duration-500 hover:-translate-y-1 hover:border-violet-400/25 hover:bg-violet-400/[0.04] hover:shadow-[0_35px_120px_rgba(124,58,237,0.12)] sm:p-12"

                    Source Code

    <div

      class="pointer-events-none fixed inset-0 z-[100] invisible"

        data-close-offcanvas
        class="absolute inset-0 bg-black/70 opacity-0 backdrop-blur-md transition-opacity duration-500"

      <aside

        aria-modal="true"

            <div>

        </div>

        <div
          class="my-8 h-px bg-gradient-to-r from-white/[0.10] via-white/[0.04] to-transparent"
        ></div>

        <div class="space-y-3">
          <a
            href="https://github.com/ayushkpai"
            target="_blank"
            rel="noopener noreferrer"
            class="group flex items-center justify-between rounded-2xl border border-white/[0.07] bg-white/[0.025] p-4 transition-all duration-300 hover:-translate-y-0.5 hover:border-white/20 hover:bg-white/[0.06]"
          >
            <div>
              <p
                class="text-sm font-medium text-white transition-colors group-hover:text-violet-100"
              >
                GitHub
              </p>

              <p class="mt-1 text-[11px] text-slate-500">ayushkpai</p>
            </div>

            <span

          <a

            <div>
              <p

              <p class="mt-1 text-[11px] text-slate-500">paiandco</p>
            </div>

            <span

              ↗

            <span

        <div class="mt-auto">
          <div

              <span

              <p
                class="text-[9px] font-semibold uppercase tracking-[0.3em] text-slate-500"
              >
                Ayush Pai

    <div
      id="command"
      class="pointer-events-none fixed inset-0 z-[300] invisible flex items-start justify-center bg-black/60 px-4 pt-[12vh] opacity-0 backdrop-blur-md transition-opacity duration-200"
    >
      <button
        type="button"
        data-command-close
        class="absolute inset-0 cursor-default"
        aria-label="Close command palette"
      ></button>

      <div
        class="relative w-full max-w-xl scale-95 overflow-hidden rounded-[1.6rem] border border-white/10 bg-[#080d17]/95 shadow-[0_35px_120px_rgba(0,0,0,.7)] backdrop-blur-2xl transition-transform duration-200"
      >
        <div class="flex items-center gap-3 border-b border-white/[0.07] px-5">
          <span class="text-lg text-slate-500">⌕</span>

          <input
            id="commandInput"
            type="text"
            placeholder="Search anything..."

            class="rounded-lg border border-white/10 bg-white/[0.04] px-2 py-1 text-[10px] text-slate-500"

            ESC

        <div id="commandItems" class="p-2">
          <a
            href="https://github.com/ayushkpai"
            target="_blank"
            rel="noopener noreferrer"
            data-command-item
            data-search="github ayushkpai"
            class="flex items-center justify-between rounded-xl px-4 py-3.5 text-sm text-slate-300 transition hover:bg-white/[0.06] hover:text-white"
          >
            <span>GitHub</span>
            <span class="text-slate-600">↗</span>
          </a>

          <a
            href="https://github.com/paiandco"
            target="_blank"
            rel="noopener noreferrer"
            data-command-item
            data-search="pai co paiandco github"
            class="flex items-center justify-between rounded-xl px-4 py-3.5 text-sm text-slate-300 transition hover:bg-white/[0.06] hover:text-white"
          >
            <span>Pai &amp; Co</span>
            <span class="text-slate-600">↗</span>
          </a>

          <button
            type="button"
            data-command-item
            data-search="retro grand prix f1 racing"
            data-open-retro
            class="flex w-full items-center justify-between rounded-xl px-4 py-3.5 text-left text-sm text-slate-300 transition hover:bg-white/[0.06] hover:text-white"
          >
            <span>Retro Grand Prix</span>
            <span class="text-red-300/70">→</span>
          </button>

          <button
            type="button"
            data-command-item
            data-search="menu navigation"
            data-open-offcanvas
            class="flex w-full items-center rounded-xl px-4 py-3.5 text-left text-sm text-slate-300 transition hover:bg-white/[0.06] hover:text-white"
          >
            <span>Open Menu</span>
          </button>
        </div>

        <div
          class="flex items-center justify-between border-t border-white/[0.07] px-5 py-3 text-[10px] text-slate-600"
        >
          <span>Navigate with your keyboard</span>
          <span>↑ ↓ Enter</span>
        </div>
      </div>
    </div>

    <div
      id="retroModal"
      class="pointer-events-none fixed inset-0 z-[400] invisible flex items-center justify-center bg-black/70 px-4 opacity-0 backdrop-blur-sm transition-opacity duration-200"
      aria-hidden="true"
    >
      <button
        type="button"
        data-close-retro
        class="absolute inset-0 cursor-default"
        aria-label="Close modal"
      ></button>

      <div
        id="retroModalPanel"
        class="relative w-full max-w-md scale-95 rounded-[1.75rem] border border-red-400/15 bg-[#080d17] p-6 shadow-[0_35px_120px_rgba(0,0,0,.75)] transition-transform duration-200 sm:p-7"
        role="dialog"
        aria-modal="true"
        aria-labelledby="retroModalTitle"
      >
        <div class="flex items-center justify-between">
          <div>
            <p
              class="text-[9px] font-semibold uppercase tracking-[0.3em] text-red-300/60"
            >
              F1 Racing
            </p>

            <h2
              id="retroModalTitle"
              class="mt-1 text-xl font-semibold text-white"
            >
              Retro Grand Prix
            </h2>
          </div>

          <button
            type="button"
            data-close-retro
            aria-label="Close modal"
            class="flex h-9 w-9 items-center justify-center rounded-xl border border-white/[0.08] bg-white/[0.03] text-lg text-slate-500 transition hover:border-white/20 hover:bg-white/[0.07] hover:text-white"
          >
            ×
          </button>
        </div>

        <div class="mt-6 grid gap-3">
          <a
            href="/retro-grand-prix"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center justify-between rounded-xl border border-red-400/15 bg-red-400/[0.05] px-4 py-3.5 text-sm font-medium text-white transition hover:border-red-400/30 hover:bg-red-400/[0.1]"
          >
            <span>Enter Grand Prix</span>
            <span class="text-red-300">↗</span>
          </a>

          <a
            href="/retro-grand-prix"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center justify-between rounded-xl border border-white/[0.08] bg-white/[0.025] px-4 py-3.5 text-sm font-medium text-slate-300 transition hover:border-white/20 hover:bg-white/[0.06] hover:text-white"
          >
            <span>View Game</span>
            <span class="text-slate-500">↗</span>
          </a>

          <button
            type="button"
            data-close-retro
            class="flex items-center justify-center rounded-xl border border-white/[0.08] bg-white/[0.025] px-4 py-3.5 text-sm font-medium text-slate-400 transition hover:border-white/20 hover:bg-white/[0.06] hover:text-white"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script>
      const offcanvas = document.getElementById("offcanvas");
      const offcanvasPanel = offcanvas.querySelector("aside");
      const command = document.getElementById("command");
      const commandPanel = command.querySelector(":scope > div");
      const commandInput = document.getElementById("commandInput");
      const progress = document.getElementById("progress");
      const retroModal = document.getElementById("retroModal");
      const retroModalPanel = document.getElementById("retroModalPanel");

      let commandItems = [...document.querySelectorAll("[data-command-item]")];
      let selectedIndex = 0;

      function updateBodyLock() {
        const locked =
          !offcanvas.classList.contains("invisible") ||
          !command.classList.contains("invisible") ||
          !retroModal.classList.contains("invisible");

        document.body.classList.toggle("overflow-hidden", locked);
      }

      function openOffcanvas() {
        closeCommand();
        closeRetroModal();

        offcanvas.classList.remove("invisible", "pointer-events-none");
        offcanvas.setAttribute("aria-hidden", "false");

        requestAnimationFrame(() => {
          offcanvas
            .querySelector("button.absolute")
            .classList.remove("opacity-0");

          offcanvasPanel.classList.remove("translate-x-full");
        });

        updateBodyLock();
      }

      function closeOffcanvas() {
        offcanvas.querySelector("button.absolute").classList.add("opacity-0");
        offcanvasPanel.classList.add("translate-x-full");
        offcanvas.setAttribute("aria-hidden", "true");

        setTimeout(() => {
          offcanvas.classList.add("invisible", "pointer-events-none");
          updateBodyLock();
        }, 500);
      }

      function openCommand() {
        closeOffcanvas();
        closeRetroModal();

        command.classList.remove(
          "invisible",
          "pointer-events-none",
          "opacity-0",
        );

        requestAnimationFrame(() => {
          commandPanel.classList.remove("scale-95");
        });

        commandInput.value = "";
        selectedIndex = 0;

        commandItems.forEach((item) => {
          item.classList.remove("hidden");
        });

        updateSelection();
        commandInput.focus();
        updateBodyLock();
      }

      function closeCommand() {
        if (command.classList.contains("invisible")) return;

        command.classList.add("opacity-0");
        commandPanel.classList.add("scale-95");

        setTimeout(() => {
          command.classList.add("invisible", "pointer-events-none");
          updateBodyLock();
        }, 200);
      }

      function openRetroModal() {
        closeCommand();
        closeOffcanvas();

        retroModal.classList.remove(
          "invisible",
          "pointer-events-none",
          "opacity-0",
        );

        requestAnimationFrame(() => {
          retroModalPanel.classList.remove("scale-95");
        });

        retroModal.setAttribute("aria-hidden", "false");
        updateBodyLock();
      }

      function closeRetroModal() {
        if (retroModal.classList.contains("invisible")) return;

        retroModal.classList.add("opacity-0");
        retroModalPanel.classList.add("scale-95");
        retroModal.setAttribute("aria-hidden", "true");

        setTimeout(() => {
          retroModal.classList.add("invisible", "pointer-events-none");
          updateBodyLock();
        }, 200);
      }

      function getVisibleItems() {
        return commandItems.filter(
          (item) => !item.classList.contains("hidden"),
        );
      }

      function updateSelection() {
        const visibleItems = getVisibleItems();

        commandItems.forEach((item) => {
          item.classList.remove(
            "bg-violet-500/10",
            "text-white",
            "ring-1",
            "ring-violet-400/20",
          );
        });

        if (!visibleItems.length) {
          selectedIndex = 0;
          return;
        }

        if (selectedIndex >= visibleItems.length) {
          selectedIndex = 0;
        }

        const selected = visibleItems[selectedIndex];

        selected.classList.add(
          "bg-violet-500/10",
          "text-white",
          "ring-1",
          "ring-violet-400/20",
        );

        selected.scrollIntoView({
          block: "nearest",
        });
      }

      function selectCommand() {
        const visibleItems = getVisibleItems();

        if (!visibleItems.length) return;

        visibleItems[selectedIndex].click();
      }

      document.querySelectorAll("[data-open-offcanvas]").forEach((button) => {
        button.addEventListener("click", openOffcanvas);
      });

      document.querySelectorAll("[data-close-offcanvas]").forEach((button) => {
        button.addEventListener("click", closeOffcanvas);
      });

      document.querySelectorAll("[data-open-command]").forEach((button) => {
        button.addEventListener("click", openCommand);
      });

      document.querySelectorAll("[data-open-retro]").forEach((button) => {
        button.addEventListener("click", openRetroModal);
      });

      document.querySelectorAll("[data-close-retro]").forEach((button) => {
        button.addEventListener("click", closeRetroModal);
      });

      document
        .querySelector("[data-command-close]")
        .addEventListener("click", closeCommand);

      commandInput.addEventListener("input", () => {
        const query = commandInput.value.toLowerCase().trim();

        commandItems.forEach((item) => {
          item.classList.toggle(
            "hidden",
            query && !item.dataset.search.toLowerCase().includes(query),
          );
        });

        selectedIndex = 0;
        updateSelection();
      });

      commandInput.addEventListener("keydown", (event) => {
        const visibleItems = getVisibleItems();

        if (event.key === "ArrowDown") {
          event.preventDefault();

          if (visibleItems.length) {
            selectedIndex = (selectedIndex + 1) % visibleItems.length;
            updateSelection();
          }
        }

        if (event.key === "ArrowUp") {
          event.preventDefault();

          if (visibleItems.length) {
            selectedIndex =
              (selectedIndex - 1 + visibleItems.length) % visibleItems.length;

            updateSelection();
          }
        }

        if (event.key === "Enter") {
          event.preventDefault();
          selectCommand();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (
          (event.metaKey || event.ctrlKey) &&
          event.key.toLowerCase() === "k"
        ) {
          event.preventDefault();
          openCommand();
        }

        if (event.key === "Escape") {
          if (!retroModal.classList.contains("invisible")) {
            closeRetroModal();
          } else if (!command.classList.contains("invisible")) {
            closeCommand();
          } else if (offcanvas.getAttribute("aria-hidden") === "false") {
            closeOffcanvas();
          }
        }
      });

      window.addEventListener(
        "scroll",
        () => {
          const height =
            document.documentElement.scrollHeight - window.innerHeight;

          progress.style.width =
            height > 0 ? `${(window.scrollY / height) * 100}%` : "0%";
        },
        { passive: true },
      );
    </script>
  </body>
</html>

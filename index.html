<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayush Pai</title>
    <link rel="icon" href="images/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-[#030712] font-sans text-white antialiased selection:bg-violet-500/30 selection:text-white"
  >
    <header class="fixed inset-x-0 top-4 z-50 px-4">
      <div
        class="mx-auto flex h-16 max-w-7xl items-center rounded-2xl border border-white/[0.08] bg-[#0b101b]/75 px-4 shadow-[0_10px_40px_rgba(0,0,0,0.25)] backdrop-blur-2xl sm:rounded-3xl sm:px-5"
      >
        <a href="/" class="group flex items-center gap-3">
          <span
            class="relative flex h-11 w-11 items-center justify-center overflow-hidden rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 p-[1px] shadow-lg shadow-violet-500/10 transition duration-500 group-hover:scale-105"
          >
            <span
              class="flex h-full w-full items-center justify-center rounded-[0.95rem] bg-[#090d17]"
            >
              <img src="images/logo.png" class="h-8 w-8 object-contain" />
            </span>
          </span>

          <div>
            <p
              class="text-sm font-semibold tracking-[-0.02em] text-white transition-colors group-hover:text-violet-100"
            >
              Ayush Pai
            </p>
          </div>
        </a>

        <nav class="ml-auto flex items-center gap-1">
          <a
            href="https://ayushpai.com/retro-grand-prix"
            target="_blank"
            rel="noopener noreferrer"
            class="group flex items-center gap-2 rounded-xl border border-cyan-400/20 bg-cyan-500/[0.06] px-3 py-2 text-sm font-medium text-cyan-200 transition-all duration-300 hover:border-cyan-400/40 hover:bg-cyan-500/10 focus:outline-none focus:ring-2 focus:ring-cyan-400/50 sm:px-4"
          >
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a2e'/%3E%3Cpath d='M6,20 L8,14 L12,12 L20,12 L24,14 L26,20 Z' fill='%23e00'/%3E%3Cellipse cx='16' cy='13' rx='3' ry='2' fill='%23111'/%3E%3Ccircle cx='16' cy='12.5' r='1.5' fill='%23ff0'/%3E%3Crect x='4' y='18' width='3' height='5' rx='1' fill='%23111'/%3E%3Crect x='25' y='18' width='3' height='5' rx='1' fill='%23111'/%3E%3Crect x='5' y='10' width='22' height='2' rx='1' fill='%23e00'/%3E%3C/svg%3E"
              alt="Retro Grand Prix racing logo"
              class="h-5 w-5"
            />
            <span class="hidden sm:inline">Retro Grand Prix</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 pb-16 pt-28 sm:px-6 sm:pt-32">
      <section class="mx-auto max-w-5xl pt-10 sm:pt-16">
        <div class="mx-auto grid w-full max-w-3xl grid-cols-1 gap-5 sm:grid-cols-2">
          <div
            class="relative flex min-h-[240px] flex-col overflow-hidden rounded-3xl border border-white/[0.08] bg-white/[0.035] p-6 shadow-[0_12px_50px_rgba(0,0,0,0.22)] backdrop-blur-xl transition-all duration-500 hover:-translate-y-1 hover:border-violet-400/30 hover:bg-white/[0.055] hover:shadow-[0_20px_70px_rgba(139,92,246,0.14)]"
          >
            <div
              class="flex h-14 w-14 items-center justify-center rounded-2xl border border-white/10 bg-[#050914]/80 text-white shadow-lg shadow-black/20"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="h-7 w-7"
                aria-hidden="true"
              >
                <path
                  d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.49.5.092.682-.217.682-.482
                  0-.237-.009-.866-.014-1.7-2.782.604-3.369-1.342-3.369-1.342-.455-1.157-1.11-1.466-1.11-1.466
                  -.908-.62.069-.608.069-.608 1.004.07 1.532 1.03 1.532 1.03.892 1.53 2.341 1.088 2.91.832
                  .092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.03-2.683
                  -.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.56 9.56 0 0 1 12 6.844
                  a9.56 9.56 0 0 1 2.504.337c1.91-1.294 2.75-1.025 2.75-1.025.544 1.377.201 2.394.098 2.647
                  .64.699 1.03 1.592 1.03 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855
                  0 1.338-.012 2.419-.012 2.748 0 .268.18.579.688.481A10.001 10.001 0 0 0 22 12
                  C22 6.477 17.523 2 12 2Z"
                />
              </svg>
            </div>

            <div class="mt-2">
              <h2
                class="mt-1 text-2xl font-semibold tracking-tight text-white"
              >
                GitHub
              </h2>
            </div>

            <div class="mt-auto flex flex-col gap-2 pt-4">
              <a
                href="https://github.com/ayushkpai"
                target="_blank"
                rel="noopener noreferrer"
                class="group flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.03] px-4 py-3 transition-all duration-300 hover:border-violet-400/40 hover:bg-violet-500/10 focus:outline-none focus:ring-2 focus:ring-violet-400/50"
              >
                <span class="text-sm font-medium text-slate-300 transition-colors group-hover:text-violet-100">
                  ayushkpai
                  <span
                    class="ml-1 inline-flex items-center rounded-full border border-violet-400/30 bg-violet-500/10 px-2 py-0.5 text-xs font-medium text-violet-300"
                  >
                    account
                  </span>
                </span>
                <span
                  class="text-slate-500 transition-all duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 group-hover:text-violet-300"
                >
                  ↗
                </span>
              </a>

              <a
                href="https://github.com/paiandco"
                target="_blank"
                rel="noopener noreferrer"
                class="group flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.03] px-4 py-3 transition-all duration-300 hover:border-violet-400/40 hover:bg-violet-500/10 focus:outline-none focus:ring-2 focus:ring-violet-400/50"
              >
                <span class="text-sm font-medium text-slate-300 transition-colors group-hover:text-violet-100">
                  paiandco
                  <span
                    class="ml-1 inline-flex items-center rounded-full border border-violet-400/30 bg-violet-500/10 px-2 py-0.5 text-xs font-medium text-violet-300"
                  >
                    org
                  </span>
                </span>
                <span
                  class="text-slate-500 transition-all duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 group-hover:text-violet-300"
                >
                  ↗
                </span>
              </a>
            </div>
          </div>

          <a
            href="https://www.bribooks.com/bookstore/the-cake-lover-by-ayush-pai/"
            target="_blank"
            rel="noopener noreferrer"
            class="group relative min-h-[240px] overflow-hidden rounded-3xl border border-white/[0.08] bg-white/[0.035] p-6 shadow-[0_12px_50px_rgba(0,0,0,0.22)] backdrop-blur-xl transition-all duration-500 hover:-translate-y-1 hover:border-rose-400/30 hover:bg-white/[0.055] hover:shadow-[0_20px_70px_rgba(244,63,94,0.14)] focus:outline-none focus:ring-2 focus:ring-rose-400/50"
          >
            <div class="relative flex h-full flex-col">
              <div class="flex items-start justify-between">
                <div
                  class="flex h-14 w-14 items-center justify-center overflow-hidden rounded-2xl border border-white/10 shadow-lg shadow-black/20 transition-all duration-500 group-hover:scale-105 group-hover:border-rose-400/30"
                >
                  <img
                    src="https://media.bribooks.com/public/AuthorCoverImages/user_cover_694030ae5edc9_b0_v1764030.png?width=400&format=png"
                    alt="The Cake Lover book cover"
                    class="h-full w-full object-cover"
                  />
                </div>

                <div
                  class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-white/[0.03] text-lg text-slate-500 transition-all duration-500 group-hover:-translate-y-1 group-hover:translate-x-1 group-hover:border-rose-400/30 group-hover:bg-rose-500/10 group-hover:text-rose-300"
                >
                  ↗
                </div>
              </div>

              <div class="mt-3">
                <h2
                  class="mt-1 text-2xl font-semibold tracking-tight text-white transition-colors duration-300 group-hover:text-rose-200"
                >
                  The Cake Lover
                </h2>

                <p
                  class="mt-1 text-sm text-slate-400 transition-colors duration-300 group-hover:text-rose-100/70"
                >
                  by Ayush Pai
                </p>

                <p
                  class="mt-3 text-sm leading-relaxed text-slate-400 transition-colors duration-300 group-hover:text-slate-300"
                >
                  Science Fiction · Super Heroes · 37 pages
                </p>
              </div>

              <div class="mt-auto flex items-center justify-between pt-4">
                <span
                  class="inline-flex items-center gap-1 rounded-full border border-amber-400/30 bg-amber-500/10 px-2.5 py-1 text-xs font-semibold text-amber-300"
                >
                  ★ 5.0
                </span>
              </div>
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>

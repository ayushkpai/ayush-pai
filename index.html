<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ayush Pai</title>

    <link rel="icon" href="images/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-[#030712] font-sans text-white antialiased selection:bg-violet-500/30 selection:text-white"
  >
    <div
      class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(circle_at_75%_5%,rgba(139,92,246,0.09),transparent_32%),radial-gradient(circle_at_10%_90%,rgba(59,130,246,0.06),transparent_30%)]"
    ></div>

    <header class="fixed inset-x-0 top-4 z-50 px-4">
      <div
        class="mx-auto flex h-16 max-w-7xl items-center rounded-2xl border border-white/[0.08] bg-[#0b101b]/75 px-4 shadow-[0_10px_40px_rgba(0,0,0,0.25)] backdrop-blur-2xl sm:rounded-3xl sm:px-5"
      >
        <div class="flex items-center gap-3">
          <img
            src="images/logo.png"
            alt="Ayush Pai"
            class="h-11 w-11 rounded-2xl bg-gradient-to-br from-violet-500 to-pink-500 p-2 ring-1 ring-white/10"
          />

          <p class="text-sm font-semibold tracking-tight text-white">
            Ayush Pai
          </p>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 pb-16 pt-28 sm:px-6 sm:pt-32">
      <section class="mx-auto max-w-5xl pt-10 sm:pt-16">
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
          <a
            href="https://github.com/ayushkpai"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Ayush Pai on GitHub"
            class="group relative min-h-[240px] overflow-hidden rounded-3xl border border-white/[0.08] bg-white/[0.035] p-6 shadow-[0_12px_50px_rgba(0,0,0,0.22)] backdrop-blur-xl transition-all duration-500 hover:-translate-y-1 hover:border-violet-400/30 hover:bg-white/[0.055] hover:shadow-[0_20px_70px_rgba(139,92,246,0.14)] focus:outline-none focus:ring-2 focus:ring-violet-400/50"
          >
            <div
              class="pointer-events-none absolute -right-24 -top-24 h-52 w-52 rounded-full bg-violet-500/10 blur-3xl transition-all duration-700 group-hover:scale-125 group-hover:bg-violet-500/20"
            ></div>

            <div
              class="pointer-events-none absolute inset-x-6 top-0 h-px bg-gradient-to-r from-transparent via-violet-400/0 to-transparent transition-all duration-700 group-hover:via-violet-400/50"
            ></div>

            <div
              class="pointer-events-none absolute bottom-0 left-0 h-px w-0 bg-gradient-to-r from-violet-500 via-fuchsia-400 to-transparent transition-all duration-700 group-hover:w-full"
            ></div>

            <div class="relative flex h-full flex-col">
              <div class="flex items-start justify-between">
                <div
                  class="flex h-14 w-14 items-center justify-center rounded-2xl border border-white/10 bg-[#050914]/80 text-white shadow-lg shadow-black/20 transition-all duration-500 group-hover:scale-105 group-hover:border-violet-400/30 group-hover:bg-violet-500/10 group-hover:text-violet-300"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    class="h-7 w-7"
                    aria-hidden="true"
                  >
                    <path
                      d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.49.5.092.682-.217.682-.482
                      0-.237-.009-.866-.014-1.7-2.782.604-3.369-1.342-3.369-1.342-.455-1.157-1.11-1.466-1.11-1.466
                      -.908-.62.069-.608.069-.608 1.004.07 1.532 1.03 1.532 1.03.892 1.53 2.341 1.088 2.91.832
                      .092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.03-2.683
                      -.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.56 9.56 0 0 1 12 6.844
                      a9.56 9.56 0 0 1 2.504.337c1.91-1.294 2.75-1.025 2.75-1.025.544 1.377.201 2.394.098 2.647
                      .64.699 1.03 1.592 1.03 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855
                      0 1.338-.012 2.419-.012 2.748 0 .268.18.579.688.481A10.001 10.001 0 0 0 22 12
                      C22 6.477 17.523 2 12 2Z"
                    />
                  </svg>
                </div>

                <div
                  class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-white/[0.03] text-lg text-slate-500 transition-all duration-500 group-hover:-translate-y-1 group-hover:translate-x-1 group-hover:border-violet-400/30 group-hover:bg-violet-500/10 group-hover:text-violet-300"
                >
                  ↗
                </div>
              </div>

              <div class="mt-auto pt-8">
                <p
                  class="text-[11px] font-medium uppercase tracking-[0.24em] text-violet-400/80"
                >
                  ayushkpai
                </p>

                <h2
                  class="mt-1 text-2xl font-semibold tracking-tight text-white transition-colors duration-300 group-hover:text-violet-200"
                >
                  GitHub
                </h2>
              </div>
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>

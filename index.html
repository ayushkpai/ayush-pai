<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Ayush Pai</title>
  </head>

  <body class="bg-black">
    <header class="fixed top-0 left-0 right-0 z-50 px-4 pt-3">
      <div
        class="max-w-7xl mx-auto h-16 rounded-3xl bg-[#080b14]/85 backdrop-blur-2xl border border-white/10 shadow-2xl flex items-center justify-between px-5"
      >
        <a href="" class="flex items-center gap-3">
          <div
            class="h-10 w-10 rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-600 flex items-center justify-center"
          >
            <img src="images/logo.png" alt="Logo" class="h-6 w-6" />
          </div>

          <div>
            <p class="text-white font-semibold">Ayush Pai</p>
          </div>
        </a>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-28 pb-8">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="rounded-xl bg-gray-900 border border-white/10 shadow-lg">
          <div class="p-5 border-b border-white/10">
            <h2 class="text-lg font-semibold text-white">GitHub</h2>
          </div>

          <div class="p-5">
            <a
              href="https://github.com/ayushkpai"
              class="text-blue-400 hover:text-blue-300 hover:underline"
              target="_blank"
              rel="noopener noreferrer"
            >
              Visit GitHub
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

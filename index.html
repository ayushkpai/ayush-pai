<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ayush Pai</title>

    <link rel="icon" href="images/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-[#030712] font-sans text-white"
  >
    <div
      class="fixed -left-32 -top-32 z-[-1] h-80 w-80 rounded-full bg-violet-600 blur-[90px] md:h-[500px] md:w-[500px] md:blur-[120px]"
    ></div>

    <div
      class="fixed -bottom-32 -right-32 z-[-1] h-80 w-80 rounded-full bg-pink-500 blur-[90px] md:h-[500px] md:w-[500px] md:blur-[120px]"
    ></div>

    <header class="fixed left-0 right-0 top-4 z-50 px-4">
      <div
        class="mx-auto flex h-14 max-w-7xl items-center rounded-2xl border border-white/10 bg-white/[0.06] px-4 backdrop-blur-xl sm:h-16 sm:rounded-3xl sm:px-5"
      >
        <div class="flex items-center gap-3">
          <img
            src="images/logo.png"
            alt="Ayush Pai"
            class="h-10 w-10 rounded-2xl bg-gradient-to-br from-violet-500 to-pink-500 p-2 sm:h-12 sm:w-12"
          />

          <p class="font-semibold">Ayush Pai</p>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 pb-10 pt-24 sm:px-6 sm:pt-32">
      <div class="mt-10 grid items-start gap-6 lg:grid-cols-3">
        <section class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:col-span-2">
          <a
            href="https://github.com/ayushkpai"
            target="_blank"
            class="group relative block overflow-hidden rounded-3xl border border-white/10 bg-white/[0.06] p-6 backdrop-blur-xl transition-all duration-500 hover:-translate-y-2 hover:border-violet-400/40 hover:bg-white/[0.09] hover:shadow-[0_20px_60px_rgba(139,92,246,0.25)] focus:outline-none focus:ring-2 focus:ring-violet-400/70"
          >
            <div
              class="pointer-events-none absolute -right-16 -top-16 h-32 w-32 rounded-full bg-violet-500/20 blur-3xl transition-all duration-500 group-hover:bg-violet-500/30"
            ></div>

            <div class="relative flex items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div
                  class="flex h-12 w-12 items-center justify-center rounded-2xl border border-white/10 bg-black/20 text-white transition-all duration-500 group-hover:scale-110 group-hover:border-violet-400/30 group-hover:bg-violet-500/10"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    class="h-6 w-6"
                    aria-hidden="true"
                  >
                    <path
                      d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.49.5.092.682-.217.682-.482
            0-.237-.009-.866-.014-1.7-2.782.604-3.369-1.342-3.369-1.342-.455-1.157-1.11-1.466-1.11-1.466
            -.908-.62.069-.608.069-.608 1.004.07 1.532 1.03 1.532 1.03.892 1.53 2.341 1.088 2.91.832
            .092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.03-2.683
            -.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.56 9.56 0 0 1 12 6.844
            a9.56 9.56 0 0 1 2.504.337c1.91-1.294 2.75-1.025 2.75-1.025.544 1.377.201 2.394.098 2.647
            .64.699 1.03 1.592 1.03 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855
            0 1.338-.012 2.419-.012 2.748 0 .268.18.579.688.481A10.001 10.001 0 0 0 22 12
            C22 6.477 17.523 2 12 2Z"
                    />
                  </svg>
                </div>

                <div>
                  <h2
                    class="mt-1 text-xl font-semibold text-white transition-colors duration-300 group-hover:text-violet-300"
                  >
                    GitHub
                  </h2>
                </div>
              </div>

              <div
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-white/10 bg-white/5 text-white/60 transition-all duration-300 group-hover:border-violet-400/40 group-hover:bg-violet-500/10 group-hover:text-violet-300 group-hover:translate-x-1"
              >
                <span class="text-lg">→</span>
              </div>
            </div>
          </a>
        </section>
      </div>
    </main>
  </body>
</html>

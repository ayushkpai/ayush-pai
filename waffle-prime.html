<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ayush Pai</title>
    <link rel="icon" href="images/favicon.ico" />
    <script>
      if (window.self === window.top) {
        location.replace("/#waffle-prime");
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: #fff;
        color: #171717;
        font-family: Arial, Helvetica, sans-serif;
      }

      @keyframes pop {
        0% {
          transform: scale(0.7);
        }
        60% {
          transform: scale(1.12);
        }
        100% {
          transform: scale(1);
        }
      }
      .anim-pop {
        animation: pop 0.28s ease-out;
      }

      @keyframes shake {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(3px);
        }
        30%,
        70% {
          transform: translateX(-5px);
        }
        40%,
        60% {
          transform: translateX(5px);
        }
        50% {
          transform: translateX(-3px);
        }
      }
      .anim-shake {
        animation: shake 0.4s ease-in-out;
      }

      @keyframes drop {
        0% {
          transform: translateY(-16px) scale(0.9);
          opacity: 0;
        }
        55% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        75% {
          transform: translateY(-4px);
        }
        100% {
          transform: translateY(0);
        }
      }
      .anim-drop {
        animation: drop 0.3s ease-out;
      }

      @keyframes steamrise {
        0% {
          opacity: 0;
          transform: translateY(6px) translateX(0) scaleX(1);
        }
        30% {
          opacity: 0.65;
        }
        100% {
          opacity: 0;
          transform: translateY(-26px) translateX(6px) scaleX(1.5);
        }
      }
      .steam span {
        display: inline-block;
        width: 3px;
        height: 12px;
        border-radius: 9999px;
        background: rgba(255, 250, 235, 0.85);
        animation: steamrise 1.4s linear infinite;
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .anim-floaty {
        animation: floaty 2.4s ease-in-out infinite;
      }

      @keyframes toastin {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .anim-toast {
        animation: toastin 0.25s ease-out;
      }

      @keyframes whoosh {
        0% {
          left: 105%;
          opacity: 0;
        }
        25% {
          opacity: 0.6;
        }
        100% {
          left: -45%;
          opacity: 0;
        }
      }
      .speedstreak {
        position: absolute;
        height: 2px;
        width: 28%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        animation: whoosh 0.6s linear infinite;
      }

      .shop-bg {
        background: radial-gradient(1100px 700px at 28% -8%, #fef9ec 0%, #fbeec8 45%, #f9d38b 78%, #e8b873 100%);
      }
      .card-paper {
        background: linear-gradient(180deg, #fffdf6 0%, #fff7e0 100%);
      }

      .btn-primary {
        color: #fffbeb;
        background-image: linear-gradient(180deg, #d97706 0%, #b45309 100%);
        box-shadow: 0 5px 0 #92400e, 0 14px 24px -10px rgba(146, 64, 14, 0.65);
        transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      }
      .btn-primary:hover {
        filter: brightness(1.06);
      }
      .btn-primary:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #92400e;
      }

      .btn-go {
        color: #ffffff;
        background-image: linear-gradient(180deg, #059669 0%, #047857 100%);
        box-shadow: 0 5px 0 #065f46, 0 14px 24px -10px rgba(6, 95, 70, 0.65);
        transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      }
      .btn-go:hover {
        filter: brightness(1.06);
      }
      .btn-go:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #065f46;
      }

      .btn-soft {
        background: #ffffff;
        border: 1px solid rgba(217, 119, 6, 0.35);
        box-shadow: 0 2px 0 rgba(217, 119, 6, 0.22);
        transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.15s ease;
      }
      .btn-soft:hover {
        border-color: rgba(217, 119, 6, 0.6);
      }
      .btn-soft:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 rgba(217, 119, 6, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef } = React;

      const INGREDIENTS = [
        { id: "flour", name: "Flour" },
        { id: "egg", name: "Egg" },
        { id: "milk", name: "Milk" },
        { id: "butter", name: "Butter" },
        { id: "sugar", name: "Sugar" },
      ];

      const TOPPINGS = [
        { id: "syrup", name: "Maple Syrup" },
        { id: "butter", name: "Butter" },
        { id: "berries", name: "Berries" },
        { id: "chocolate", name: "Chocolate" },
        { id: "whipped", name: "Whipped Cream" },
      ];

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      const REQUESTS = [
        { id: "crispy", label: "extra crispy", conflicts: [] },
        { id: "no-syrup", label: "no syrup", conflicts: ["syrup"] },
        { id: "no-berries", label: "no berries", conflicts: ["berries"] },
        { id: "double-butter", label: "double butter", conflicts: [] },
      ];

      function makeRequest(required) {
        const pool = REQUESTS.filter((r) => !r.conflicts.some((c) => required.includes(c)));
        if (pool.length === 0 || Math.random() < 0.5) return null;
        const pick = pool[Math.floor(Math.random() * pool.length)];
        return { id: pick.id, label: pick.label };
      }

      function meetsRequest(r, rating, topps) {
        switch (r.id) {
          case "crispy":
            return rating === "crisp";
          case "no-syrup":
            return !topps.includes("syrup");
          case "no-berries":
            return !topps.includes("berries");
          case "double-butter":
            return topps.filter((t) => t === "butter").length >= 2;
        }
      }

      function makeOrder() {
        const ids = ["flour", "egg", "milk", "butter", "sugar"];
        const recipe = shuffle(ids).slice(0, 3);
        const required = shuffle(TOPPINGS.map((t) => t.id)).slice(0, Math.random() > 0.5 ? 2 : 1);
        const names = TOPPINGS.filter((t) => required.includes(t.id)).map((t) => t.name);
        return {
          name: "Waffle with " + names.join(" & "),
          recipe,
          required,
          dineIn: Math.random() < 0.5,
          request: makeRequest(required),
        };
      }

      const GOLDEN_MIN = 0.38;
      const GOLDEN_MAX = 0.6;
      const CRISP_MAX = 0.75;

      const ZONES = [
        { from: 0, to: 0.3, label: "raw" },
        { from: 0.3, to: 0.38, label: "faint" },
        { from: 0.38, to: 0.6, label: "GOLDEN" },
        { from: 0.6, to: 0.75, label: "crisp" },
        { from: 0.75, to: 1, label: "burnt" },
      ];

      function toppingColor(id) {
        switch (id) {
          case "syrup":
            return "#d99a28";
          case "butter":
            return "#ffd94a";
          case "berries":
            return "#7a4bf0";
          case "chocolate":
            return "#6b3a1f";
          case "whipped":
            return "#f5f0e2";
        }
      }

      const WARM_MAX = 100;
      const WARM_DRAIN = WARM_MAX / 16;
      const DELIVERY_BLOCKS = 6;
      const PEDAL_BASE = 0.55;
      const PEDAL_STEP = 0.05;
      const PEDAL_MAX = 1.2;
      const HAZARD_WINDOW = 0.9;
      const HAZARD_DAMAGE = 12;
      const HAZARD_AT = [4, 8.5];
      const HAZARD_TYPES = ["pothole", "cone", "pedestrian"];

      function pickHazard() {
        return HAZARD_TYPES[Math.floor(Math.random() * HAZARD_TYPES.length)];
      }

      const STREETS = ["Batter Ave", "Syrup St", "Maple Blvd", "Waffle Way", "Honey Dr", "Griddle Ct"];

      function randomAddress() {
        const street = STREETS[Math.floor(Math.random() * STREETS.length)];
        const num = Math.floor(Math.random() * 900) + 10;
        return num + " " + street;
      }

      function tipFor(warmth) {
        if (warmth >= 70) return { tip: 14, note: "Piping hot delivery!" };
        if (warmth >= 45) return { tip: 8, note: "Warm and happy customer!" };
        if (warmth >= 20) return { tip: 3, note: "A bit lukewarm..." };
        return { tip: 1, note: "Cold waffle, tiny tip." };
      }

      const PATIENCE_MAX = 100;
      const PATIENCE_DRAIN = PATIENCE_MAX / 15;

      function tipForFreshness(patience) {
        if (patience >= 70) return { tip: 8, note: "Right from the iron! Great tip." };
        if (patience >= 45) return { tip: 5, note: "Still nice and hot. Good tip." };
        if (patience >= 20) return { tip: 3, note: "A little slow off the iron..." };
        return { tip: 2, note: "They waited a while. Small tip." };
      }

      // ---- art helpers ----
      function lerp(a, b, t) {
        return Math.round(a + (b - a) * t);
      }

      function donenessColor(t) {
        const stops = [
          [238, 200, 110],
          [211, 155, 46],
          [63, 42, 20],
        ];
        const seg = Math.min(Math.max(t, 0), 1) * 2;
        const i = Math.min(1, Math.floor(seg));
        const f = seg - i;
        const a = stops[i];
        const b = stops[i + 1] || stops[1];
        return `rgb(${lerp(a[0], b[0], f)}, ${lerp(a[1], b[1], f)}, ${lerp(a[2], b[2], f)})`;
      }

      function mix(towards, t) {
        const c = [63, 42, 20];
        return `rgb(${lerp(c[0], 255, t)}, ${lerp(c[1], 252, t)}, ${lerp(c[2], 230, t)})`;
      }

      const TOPPING_GLYPHS = {
        syrup: (
          <g>
            <ellipse cx={36} cy={36} rx={13} ry={7} fill="rgba(217,154,40,0.9)" />
            <ellipse cx={66} cy={48} rx={14} ry={7} fill="rgba(199,138,34,0.9)" />
            <ellipse cx={42} cy={66} rx={10} ry={6} fill="rgba(217,154,40,0.85)" />
            <ellipse cx={76} cy={84} rx={12} ry={7} fill="rgba(199,138,34,0.9)" />
          </g>
        ),
        butter: (
          <g>
            <rect x={58} y={18} width={9} height={7} rx={2} fill="#ffdf6b" />
            <rect x={50} y={30} width={8} height={6} rx={2} fill="#f7ce4a" />
            <rect x={66} y={36} width={8} height={6} rx={2} fill="#ffe473" />
          </g>
        ),
        berries: (
          <g>
            <circle cx={24} cy={30} r={3.4} fill="#7a4bf0" />
            <circle cx={24} cy={30} r={1.1} fill="#c9b6ff" />
            <circle cx={34} cy={40} r={3} fill="#e85d75" />
            <circle cx={34} cy={40} r={1} fill="#ffc2ce" />
            <circle cx={46} cy={30} r={3} fill="#3a6df0" />
            <circle cx={46} cy={30} r={1} fill="#aec6ff" />
            <circle cx={26} cy={50} r={3} fill="#7a4bf0" />
            <circle cx={58} cy={36} r={3.2} fill="#e85d75" />
          </g>
        ),
        chocolate: (
          <g>
            <rect x={14} y={48} width={8} height={6} rx={1.6} fill="#6b3a1f" />
            <rect x={14} y={48} width={8} height={3} rx={1.6} fill="#8a5233" />
            <rect x={22} y={56} width={7} height={5} rx={1.6} fill="#5a2f18" />
            <rect x={40} y={52} width={8} height={6} rx={1.6} fill="#6b3a1f" />
            <rect x={40} y={52} width={8} height={3} rx={1.6} fill="#8a5233" />
          </g>
        ),
        whipped: (
          <g>
            <circle cx={22} cy={14} r={7} fill="#fffdf7" />
            <circle cx={22} cy={14} r={3.4} fill="#f0ead8" />
            <circle cx={38} cy={12} r={6} fill="#fffdf7" />
            <circle cx={52} cy={18} r={7} fill="#fffdf7" />
            <circle cx={52} cy={18} r={3.4} fill="#f0ead8" />
            <circle cx={68} cy={26} r={5.6} fill="#fffdf7" />
          </g>
        ),
      };

      function TopWaffle({ doneness, toppings }) {
        const base = donenessColor(doneness);
        const light = mix(base, 0.55);
        const dark = mix(base, -0.35);
        const cells = [];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            const x = 5 + c * 19;
            const y = 5 + r * 19;
            cells.push(
              <g key={`${r}-${c}`}>
                <rect x={x} y={y} width={18} height={18} rx={3} fill={light} stroke={dark} strokeOpacity={0.35} strokeWidth={1} />
                <circle cx={x + 9} cy={y + 9} r={2.1} fill={dark} opacity={0.22} />
              </g>
            );
          }
        }
        return (
          <svg viewBox="0 0 105 105" className="h-full w-full select-none" aria-hidden="true">
            <rect x={2} y={2} width={101} height={101} rx={12} fill={base} stroke={dark} strokeOpacity={0.6} strokeWidth={2} />
            {cells}
            {toppings.map((t, i) => (
              <g key={`${t}-${i}`} className="anim-drop">
                {TOPPING_GLYPHS[t]}
              </g>
            ))}
          </svg>
        );
      }

      function CellPlate({ className }) {
        const cells = [];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            cells.push(
              <rect key={`${r}-${c}`} x={5 + c * 19} y={5 + r * 19} width={18} height={18} rx={3} fill="#1e2126" stroke="#000" strokeOpacity={0.5} />
            );
          }
        }
        return (
          <svg viewBox="0 0 105 105" className={`h-full w-full select-none ${className || ""}`} aria-hidden="true">
            {cells}
          </svg>
        );
      }

      function IngredientGlyph({ id, className }) {
        const cls = `h-11 w-11 select-none ${className || ""}`;
        switch (id) {
          case "flour":
            return (
              <svg viewBox="0 0 40 40" className={cls} aria-hidden="true">
                <circle cx={20} cy={30} r={12} fill="#f8f0dc" stroke="#d9cba6" />
                <ellipse cx={20} cy={26} rx={10} ry={5} fill="#fdfaf2" />
                <circle cx={12} cy={22} r={2} fill="#fdfaf2" />
                <circle cx={24} cy={21} r={2} fill="#fdfaf2" />
              </svg>
            );
          case "egg":
            return (
              <svg viewBox="0 0 40 40" className={cls} aria-hidden="true">
                <ellipse cx={20} cy={22} rx={12} ry={14} fill="#f7edd2" stroke="#d8c393" />
                <ellipse cx={20} cy={24} rx={5.5} ry={5.5} fill="#f5b83d" />
                <circle cx={18.5} cy={22.5} r={1.6} fill="#fff" opacity={0.8} />
              </svg>
            );
          case "milk":
            return (
              <svg viewBox="0 0 40 40" className={cls} aria-hidden="true">
                <rect x={12} y={10} width={16} height={26} rx={2} fill="#eaf2fb" stroke="#b9cfe8" />
                <path d="M12 14 L28 8 V14 Z" fill="#b9cfe8" />
                <rect x={17} y={20} width={6} height={6} rx={1} fill="#f3f7fd" />
              </svg>
            );
          case "butter":
            return (
              <svg viewBox="0 0 40 40" className={cls} aria-hidden="true">
                <rect x={10} y={14} width={20} height={13} rx={2} fill="#ffd94a" stroke="#d9b230" />
                <rect x={10} y={14} width={20} height={6} rx={2} fill="#ffe473" />
                <circle cx={24} cy={21} r={1.4} fill="#e8c237" />
              </svg>
            );
          case "sugar":
            return (
              <svg viewBox="0 0 40 40" className={cls} aria-hidden="true">
                <rect x={15} y={18} width={10} height={9} rx={1.5} fill="#fffdf6" stroke="#dcd5c2" />
                <rect x={11} y={27} width={18} height={8} rx={1.5} fill="#fbf7ea" stroke="#dcd5c2" />
              </svg>
            );
        }
      }

      // ---- main game ----
      function WaffleGame() {
        const [screen, setScreen] = useState("start");
        const [phase, setPhase] = useState("mix");
        const [order, setOrder] = useState(() => makeOrder());
        const [pantry, setPantry] = useState(() => shuffle(INGREDIENTS.map((i) => i.id)));
        const [step, setStep] = useState(0);
        const [mistakes, setMistakes] = useState(0);
        const [hearts, setHearts] = useState(3);
        const [cooking, setCooking] = useState(false);
        const [cook, setCook] = useState(0);
        const [cookSpeed, setCookSpeed] = useState(0.13);
        const [doneness, setDoneness] = useState(0);
        const [toppings, setToppings] = useState([]);
        const [score, setScore] = useState(0);
        const [served, setServed] = useState(0);
        const [toast, setToast] = useState(null);
        const [shakeId, setShakeId] = useState(null);
        const [rating, setRating] = useState(null);
        const [warmth, setWarmth] = useState(WARM_MAX);
        const [blocksLeft, setBlocksLeft] = useState(DELIVERY_BLOCKS);
        const [cooldown, setCooldown] = useState(0);
        const [street, setStreet] = useState(() => randomAddress());
        const [road, setRoad] = useState(0);
        const [patience, setPatience] = useState(PATIENCE_MAX);
        const [hazard, setHazard] = useState(null);
        const [hazardLeft, setHazardLeft] = useState(0);

        const clickLock = useRef(false);
        const roadRef = useRef(0);
        const patienceRef = useRef(PATIENCE_MAX);
        const warmthRef = useRef(WARM_MAX);
        const blocksRef = useRef(DELIVERY_BLOCKS);
        const cooldownRef = useRef(0);
        const pedalCountRef = useRef(0);
        const hazardRef = useRef(null);
        const hazardUntilRef = useRef(0);
        const hazardsQueueRef = useRef([]);
        const deliveryElapsedRef = useRef(0);

        const showToast = (msg) => {
          setToast(null);
          requestAnimationFrame(() => setToast(msg));
        };

        useEffect(() => {
          if (!toast) return;
          const t = setTimeout(() => setToast(null), 2400);
          return () => clearTimeout(t);
        }, [toast]);

        const failCook = () => {
          clickLock.current = true;
          setCooking(false);
          setCook(0);
          setDoneness(0);
          const left = hearts - 1;
          setHearts(left);
          showToast("Burnt to a crisp! -1 heart");
          setTimeout(() => {
            clickLock.current = false;
            if (left <= 0) {
              setScreen("over");
              return;
            }
            setPhase("mix");
            setStep(0);
            setMistakes(0);
            setToppings([]);
            setRating(null);
          }, 900);
        };

        useEffect(() => {
          if (phase !== "cook" || !cooking) return;
          let raf = 0;
          let last = performance.now();
          let progress = 0;
          const tick = (now) => {
            const dt = (now - last) / 1000;
            last = now;
            progress = Math.min(progress + dt * cookSpeed, 1);
            setCook(progress);
            setDoneness(Math.min(progress * 0.95, 0.97));
            if (progress >= 1) {
              failCook();
              return;
            }
            raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [phase, cooking, cookSpeed]);

        const tryIngredient = (id) => {
          if (phase !== "mix" || clickLock.current) return;
          if (id === order.recipe[step]) {
            const name = INGREDIENTS.find((i) => i.id === id)?.name;
            const done = step + 1 === order.recipe.length;
            setStep((s) => s + 1);
            setScore((s) => s + 4);
            showToast(`+$4  ${name} in!`);
            clickLock.current = true;
            setTimeout(() => {
              clickLock.current = false;
              if (done) {
                showToast("Batter is ready. Pour it in and cook.");
                setPhase("cook");
                setCooking(false);
                setCook(0);
                setDoneness(0);
              }
            }, 450);
          } else {
            const next = mistakes + 1;
            setMistakes(next);
            setShakeId(id);
            setTimeout(() => setShakeId(null), 420);
            if (next >= 3) {
              const left = hearts - 1;
              setHearts(left);
              setMistakes(0);
              showToast("Recipe ruined! -1 heart");
              clickLock.current = true;
              setTimeout(() => {
                clickLock.current = false;
                if (left <= 0) setScreen("over");
              }, 900);
            } else {
              showToast(`Not the next ingredient. (${next}/3 mistakes)`);
            }
          }
        };

        const toggleIron = () => {
          if (phase !== "cook" || clickLock.current) return;
          if (!cooking) {
            setCooking(true);
            showToast("Sizzle.... open it when the needle hits GOLDEN!");
            return;
          }
          if (cook < GOLDEN_MIN) return;
          if (cook > CRISP_MAX) {
            failCook();
            return;
          }
          const rate = cook <= GOLDEN_MAX ? "golden" : "crisp";
          const bonus = rate === "golden" ? 12 : 6;
          clickLock.current = true;
          setRating(rate);
          setCooking(false);
          setScore((s) => s + bonus);
          showToast(rate === "golden" ? "Perfect golden waffle! +$12" : "A bit crispy. +$6");
          setTimeout(() => {
            clickLock.current = false;
            setPhase("serve");
          }, 900);
        };

        const addTopping = (id) => {
          if (phase !== "serve" || clickLock.current) return;
          if (toppings.length >= 8) return;
          setToppings((t) => [...t, id]);
        };

        const startNextOrder = () => {
          setOrder(makeOrder());
          setPantry(shuffle(INGREDIENTS.map((i) => i.id)));
          setPhase("mix");
          setStep(0);
          setMistakes(0);
          setToppings([]);
          setRating(null);
          setCookSpeed(0.11 + Math.random() * 0.07);
          warmthRef.current = WARM_MAX;
          setWarmth(WARM_MAX);
          blocksRef.current = DELIVERY_BLOCKS;
          setBlocksLeft(DELIVERY_BLOCKS);
          cooldownRef.current = 0;
          setCooldown(0);
          roadRef.current = 0;
          setRoad(0);
          pedalCountRef.current = 0;
          hazardRef.current = null;
          setHazard(null);
          setHazardLeft(0);
          hazardsQueueRef.current = [...HAZARD_AT];
          deliveryElapsedRef.current = 0;
          setStreet(randomAddress());
        };

        const serve = () => {
          if (phase !== "serve" || clickLock.current) return;
          const hasRequired = order.required.every((r) => toppings.includes(r));
          if (!hasRequired) {
            showToast("Missing something the customer ordered!");
            return;
          }
          const optional = toppings.filter((t) => !order.required.includes(t)).length;
          const requestMet = order.request ? meetsRequest(order.request, rating, toppings) : false;
          const pay = 6 + 3 * order.required.length + 2 * optional + (requestMet ? 6 : 0);
          setScore((s) => s + pay);
          clickLock.current = true;
          const requestNote = order.request
            ? requestMet
              ? ` Nailed the "${order.request.label}" request! +$6!`
              : ` (missed the "${order.request.label}"...)`
            : "";
          if (order.dineIn) {
            showToast(`Rung up! +$${pay} — take the plate to the table!${requestNote}`);
            setTimeout(() => {
              clickLock.current = false;
              patienceRef.current = PATIENCE_MAX;
              setPatience(PATIENCE_MAX);
              setPhase("table");
            }, 1100);
            return;
          }
          showToast(`Rung up! +$${pay} — now deliver it hot.${requestNote}`);
          clickLock.current = true;
          setTimeout(() => {
            clickLock.current = false;
            warmthRef.current = WARM_MAX;
            setWarmth(WARM_MAX);
            blocksRef.current = DELIVERY_BLOCKS;
            setBlocksLeft(DELIVERY_BLOCKS);
            cooldownRef.current = 0;
            setCooldown(0);
            roadRef.current = 0;
            setRoad(0);
            patienceRef.current = PATIENCE_MAX;
            setPatience(PATIENCE_MAX);
            pedalCountRef.current = 0;
            hazardRef.current = null;
            setHazard(null);
            setHazardLeft(0);
            hazardsQueueRef.current = [...HAZARD_AT];
            deliveryElapsedRef.current = 0;
            setStreet(randomAddress());
            setPhase("delivery");
          }, 1100);
        };

        const serveTable = () => {
          if (phase !== "table" || clickLock.current) return;
          const { tip, note } = tipForFreshness(patienceRef.current);
          clickLock.current = true;
          setScore((s) => s + tip);
          setServed((s) => s + 1);
          showToast(`${note} +$${tip} tip`);
          setTimeout(() => {
            clickLock.current = false;
            startNextOrder();
          }, 1200);
        };

        const pedal = () => {
          if (phase !== "delivery" || clickLock.current) return;
          if (blocksRef.current <= 0 || warmthRef.current <= 0) return;
          if (cooldownRef.current > 0) return;
          if (hazardRef.current) return;
          const left = blocksRef.current - 1;
          blocksRef.current = left;
          setBlocksLeft(left);
          const cd = Math.min(PEDAL_BASE + pedalCountRef.current * PEDAL_STEP, PEDAL_MAX);
          pedalCountRef.current += 1;
          cooldownRef.current = cd;
          setCooldown(cd);
          if (left <= 0) arrive(warmthRef.current);
        };

        const arrive = (w) => {
          const { tip, note } = tipFor(w);
          clickLock.current = true;
          hazardRef.current = null;
          setHazard(null);
          setHazardLeft(0);
          setScore((s) => s + tip);
          setServed((s) => s + 1);
          showToast(`${note} +$${tip} tip`);
          setTimeout(() => {
            clickLock.current = false;
            startNextOrder();
          }, 1300);
        };

        const failDelivery = () => {
          if (clickLock.current) return;
          clickLock.current = true;
          hazardRef.current = null;
          setHazard(null);
          setHazardLeft(0);
          warmthRef.current = 0;
          setWarmth(0);
          const left = hearts - 1;
          setHearts(left);
          showToast("The waffle went cold in the bag. -1 heart");
          setTimeout(() => {
            clickLock.current = false;
            if (left <= 0) {
              setScreen("over");
              return;
            }
            startNextOrder();
          }, 1100);
        };

        const hitHazard = () => {
          const name = hazardRef.current || "obstacle";
          hazardRef.current = null;
          setHazard(null);
          setHazardLeft(0);
          warmthRef.current = Math.max(warmthRef.current - HAZARD_DAMAGE, 0);
          setWarmth(warmthRef.current);
          showToast(`Ouch — hit a ${name}! -${HAZARD_DAMAGE}% warmth`);
          if (warmthRef.current <= 0) failDelivery();
        };

        const dodgeHazard = () => {
          if (!hazardRef.current) return;
          hazardRef.current = null;
          setHazard(null);
          setHazardLeft(0);
          warmthRef.current = Math.min(warmthRef.current + 4, WARM_MAX);
          setWarmth(warmthRef.current);
          showToast("Smooth dodge! +4% warmth");
        };

        useEffect(() => {
          if (phase !== "delivery") return;
          let raf = 0;
          let last = performance.now();
          const tick = (now) => {
            const dt = (now - last) / 1000;
            last = now;
            if (blocksRef.current <= 0) return;
            roadRef.current += dt * (cooldownRef.current > 0 ? 1 : 0.3);
            setRoad(roadRef.current);
            warmthRef.current = Math.max(warmthRef.current - dt * WARM_DRAIN, 0);
            setWarmth(warmthRef.current);
            cooldownRef.current = Math.max(cooldownRef.current - dt, 0);
            setCooldown(cooldownRef.current);

            deliveryElapsedRef.current += dt;
            const nextAt = hazardsQueueRef.current[0];
            if (!hazardRef.current && nextAt !== undefined && deliveryElapsedRef.current >= nextAt) {
              hazardsQueueRef.current.shift();
              hazardRef.current = pickHazard();
              setHazard(hazardRef.current);
              hazardUntilRef.current = deliveryElapsedRef.current + HAZARD_WINDOW;
              showToast(`A ${hazardRef.current} is up ahead — dodge!`);
            }
            if (hazardRef.current && !clickLock.current) {
              const left = hazardUntilRef.current - deliveryElapsedRef.current;
              setHazardLeft(Math.max(0, left));
              if (left <= 0) hitHazard();
            } else {
              setHazardLeft(0);
            }

            if (warmthRef.current <= 0) {
              failDelivery();
              return;
            }
            raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [phase]);

        useEffect(() => {
          if (phase !== "table") return;
          let raf = 0;
          let last = performance.now();
          const tick = (now) => {
            const dt = (now - last) / 1000;
            last = now;
            patienceRef.current = Math.max(patienceRef.current - dt * PATIENCE_DRAIN, 0);
            setPatience(patienceRef.current);
            raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        }, [phase]);

        useEffect(() => {
          const onKey = (e) => {
            if (e.code !== "Space" || screen !== "play") return;
            e.preventDefault();
            if (phase === "cook") toggleIron();
            else if (phase === "serve") serve();
            else if (phase === "table") serveTable();
            else if (phase === "delivery") {
              if (hazardRef.current) dodgeHazard();
              else pedal();
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [screen, phase, cooking, cook, toppings, order, hearts, cooldown, hazard]);

        const startOver = () => {
          setScreen("play");
          setOrder(makeOrder());
          setHearts(3);
          setScore(0);
          setServed(0);
          setStep(0);
          setMistakes(0);
          setPhase("mix");
          setCookSpeed(0.13);
          setCooking(false);
          setCook(0);
          setDoneness(0);
          setToppings([]);
          setRating(null);
          warmthRef.current = WARM_MAX;
          setWarmth(WARM_MAX);
          blocksRef.current = DELIVERY_BLOCKS;
          setBlocksLeft(DELIVERY_BLOCKS);
          cooldownRef.current = 0;
          setCooldown(0);
          roadRef.current = 0;
          setRoad(0);
          patienceRef.current = PATIENCE_MAX;
          setPatience(PATIENCE_MAX);
          pedalCountRef.current = 0;
          hazardRef.current = null;
          setHazard(null);
          setHazardLeft(0);
          hazardsQueueRef.current = [...HAZARD_AT];
          deliveryElapsedRef.current = 0;
          setStreet(randomAddress());
        };

        if (screen === "start") {
          return (
            <Panel>
              <div className="flex flex-col items-center gap-3">
                <div className="grid h-16 w-16 place-items-center rounded-3xl bg-amber-700 shadow-lg">
                  <MiniWaffle className="h-11 w-11" />
                </div>
                <h1 className="text-3xl font-black tracking-tight text-amber-950">Waffle Prime</h1>
                <p className="text-sm text-amber-800/80">
                  Run the stand. Mix the batter, nail the cook, serve what each customer ordered.
                </p>
              </div>
              <ol className="w-full max-w-xs space-y-2.5 text-left text-sm text-amber-900">
                {[
                  "Add the 3 recipe ingredients in order.",
                  "Close the iron and open it in the GOLDEN zone.",
                  "Add every topping on the ticket, then serve.",
                  "Pedal to the address before the waffle cools.",
                ].map((item, i) => (
                  <li key={item} className="flex items-center gap-2.5">
                    <span className="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-amber-200 text-xs font-black text-amber-900">{i + 1}</span>
                    <span>{item}</span>
                  </li>
                ))}
              </ol>
              <button onClick={startOver} className="btn-primary rounded-full px-8 py-3 text-lg font-bold">
                Open the Shop
              </button>
            </Panel>
          );
        }

        if (screen === "over") {
          return (
            <Panel>
              <h1 className="text-2xl font-black text-amber-950">Out of waffle love!</h1>
              <p className="text-amber-800/80">
                You served <span className="font-black text-amber-950">{served} orders</span> and earned{" "}
                <span className="font-black text-amber-950">${score}</span>.
              </p>
              <div className="flex h-44 w-44 items-center justify-center rounded-full border-4 border-dashed border-amber-300 bg-amber-100/60">
                <div className="anim-floaty h-32 w-32 drop-shadow-lg">
                  <TopWaffle doneness={0.55} toppings={["syrup", "whipped"]} />
                </div>
              </div>
              <button onClick={startOver} className="btn-primary rounded-full px-8 py-3 text-lg font-bold">
                Open Again
              </button>
            </Panel>
          );
        }

        const inGoldenZone = cook >= GOLDEN_MIN && cook <= GOLDEN_MAX;

        return (
          <div className="shop-bg flex min-h-[100dvh] w-full items-start justify-center px-3 py-5 sm:px-4 sm:py-8">
            <div className="flex w-full max-w-3xl flex-col items-center gap-3 sm:gap-4">
              <header className="flex w-full items-center justify-between rounded-3xl border border-amber-200 bg-white/70 px-4 py-2.5 shadow-sm backdrop-blur sm:px-5 sm:py-3">
                <div className="flex items-center gap-3">
                  <div className="grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-b from-amber-600 to-amber-800 shadow-md sm:h-11 sm:w-11">
                    <MiniWaffle className="h-7 w-7 sm:h-8 sm:w-8" />
                  </div>
                  <div className="leading-tight">
                    <div className="text-base font-black tracking-tight text-amber-950 sm:text-lg">Waffle Prime</div>
                    <div className="flex items-center gap-1.5">
                      <div className="text-[10px] font-bold uppercase tracking-widest text-amber-700/70 sm:text-[11px]">
                        order <span className="text-amber-900">#{served + 1}</span>
                      </div>
                      <span
                        className={`rounded-full px-2 py-0.5 text-[8px] font-black uppercase tracking-wider ${
                          order.dineIn ? "bg-sky-100 text-sky-700" : "bg-emerald-100 text-emerald-700"
                        }`}
                      >
                        {order.dineIn ? "dine-in" : "delivery"}
                      </span>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2.5 sm:gap-3">
                  <div className="flex items-center gap-1.5 rounded-full border border-amber-300 bg-amber-50 px-2.5 py-1 sm:px-3">
                    <span className="text-[10px] font-black uppercase tracking-wider text-amber-600">cash</span>
                    <span className="text-base font-black text-amber-950 sm:text-lg">${score}</span>
                  </div>
                  <div aria-label={`${hearts} hearts left`} className="flex items-center gap-1">
                    {Array.from({ length: 3 }).map((_, i) => (
                      <span
                        key={i}
                        className={`h-3 w-3 rotate-45 rounded-[3px] border transition sm:h-3.5 sm:w-3.5 ${
                          i < hearts
                            ? "border-red-500 bg-red-500 shadow-[0_2px_4px_rgba(220,38,38,0.5)]"
                            : "border-red-300/60 bg-transparent"
                        }`}
                      />
                    ))}
                  </div>
                </div>
              </header>

              <div className="flex w-full items-center justify-center gap-2 rounded-2xl border border-amber-200 bg-amber-50/80 px-4 py-2.5 text-center text-sm font-bold text-amber-900 shadow-sm sm:py-3">
                <span
                  className={`h-2.5 w-2.5 shrink-0 rounded-full ${
                    phase === "delivery"
                      ? "bg-emerald-500"
                      : phase === "table"
                      ? "bg-sky-500"
                      : phase === "cook"
                      ? "bg-orange-500"
                      : "bg-amber-500"
                  }`}
                />
                {phase === "mix" && (
                  <span>Mix the batter: add the 3 ingredients on the recipe card, in order.</span>
                )}
                {phase === "cook" && (
                  <span>
                    {cooking ? "Click (or press space) to open the iron when the needle hits GOLDEN!" : "Pour the batter and close the iron."}
                  </span>
                )}
                {phase === "serve" && (
                  <span>
                    {order.dineIn ? "Serve it at the counter — this customer is eating in!" : `Add what they ordered, then deliver it to ${street}.`}{" "}
                    {order.request && <span className="text-amber-950">Request: {order.request.label} (+$6).</span>}
                  </span>
                )}
                {phase === "table" && <span>Carry the plate to the table before it gets cold!</span>}
                {phase === "delivery" && <span>Pedal to {street} fast — the warm meter is draining!</span>}
              </div>

              {toast && (
                <div className="anim-toast z-20 rounded-full border border-amber-600/70 bg-amber-950 px-5 py-2 text-sm font-bold text-amber-100 shadow-xl">
                  {toast}
                </div>
              )}

              <div className="grid w-full grid-cols-1 gap-4 md:grid-cols-2 sm:gap-5">
                <section className="card-paper flex flex-col items-center gap-3 rounded-3xl border border-amber-200 p-5 shadow-sm sm:gap-4">
                  <div className="relative h-56 w-56 sm:h-64 sm:w-64">
                    <div className="grid h-full w-full place-items-center rounded-[2rem] border-[10px] border-zinc-700 bg-gradient-to-br from-zinc-600 via-zinc-800 to-zinc-950 shadow-[inset_0_0_0_1px_rgba(255,255,255,0.1),0_24px_44px_-22px_rgba(0,0,0,0.7)]">
                      <div className="relative h-[calc(100%-1rem)] w-[calc(100%-1rem)] overflow-hidden rounded-2xl bg-zinc-900 p-2">
                        <CellPlate className="opacity-80" />
                        {phase !== "mix" && (
                          <div className="absolute inset-2">
                            <TopWaffle doneness={doneness} toppings={toppings} />
                          </div>
                        )}
                        {phase === "cook" && cooking && (
                          <div className="steam pointer-events-none absolute inset-x-0 bottom-1 flex items-end justify-center gap-2 overflow-hidden">
                            <span style={{ animationDelay: "0s" }} />
                            <span style={{ animationDelay: "0.4s" }} />
                            <span style={{ animationDelay: "0.8s" }} />
                          </div>
                        )}
                        {inGoldenZone && (
                          <div className="pointer-events-none absolute inset-0 rounded-2xl shadow-[inset_0_0_36px_14px_rgba(251,191,36,0.5)]" />
                        )}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5 text-[11px] font-black uppercase tracking-widest text-amber-700">
                    <span
                      className={`h-1.5 w-1.5 rounded-full ${
                        phase === "mix"
                          ? "bg-amber-400"
                          : phase === "cook"
                          ? cooking
                            ? "bg-orange-500 animate-pulse"
                            : "bg-orange-400"
                          : phase === "serve"
                          ? rating === "golden"
                            ? "bg-amber-500"
                            : "bg-amber-400"
                          : "bg-emerald-500"
                      }`}
                    />
                    {phase === "mix" && "prepare the batter"}
                    {phase === "cook" && (cooking ? "cooking..." : "ready to cook")}
                    {phase === "serve" &&
                      (rating === "golden" ? "golden grade" : rating === "crisp" ? "crispy grade" : "build your waffle")}
                    {phase === "table" && "serve the table"}
                    {phase === "delivery" && "hot delivery zone"}
                  </div>
                </section>

                <section className="flex flex-col gap-3 sm:gap-4">
                  {phase === "mix" && (
                    <>
                      <div className="card-paper rounded-2xl border border-amber-200 p-3 shadow-sm sm:p-4">
                        <div className="mb-2 flex items-center justify-between">
                          <div className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-amber-700">
                            <MiniWaffle className="h-4 w-4" />
                            Recipe card
                          </div>
                          <span className="text-[10px] font-bold uppercase tracking-wider text-amber-700/70">
                            {step}/{order.recipe.length}
                          </span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          {order.recipe.map((rid, i) => {
                            const done = i < step;
                            const now = i === step;
                            return (
                              <div key={rid} className="flex items-center gap-1.5">
                                {i > 0 && <span className="text-sm font-black text-amber-400">→</span>}
                                <div
                                  className={`relative flex flex-col items-center gap-1 rounded-2xl border-2 px-2.5 py-2 transition ${
                                    done
                                      ? "border-emerald-300 bg-emerald-50"
                                      : now
                                      ? "anim-pop border-amber-400 bg-amber-100 ring-2 ring-amber-300"
                                      : "border-amber-200 bg-white"
                                  }`}
                                >
                                  {done && (
                                    <span className="absolute -right-1.5 -top-1.5 grid h-5 w-5 place-items-center rounded-full bg-emerald-500 text-[10px] font-black text-white shadow">
                                      ✓
                                    </span>
                                  )}
                                  <IngredientGlyph id={rid} className="h-9 w-9" />
                                  <span
                                    className={`grid h-5 w-5 place-items-center rounded-full text-xs font-black ${
                                      done
                                        ? "bg-emerald-200 text-emerald-800"
                                        : now
                                        ? "bg-amber-500 text-white"
                                        : "bg-zinc-100 text-zinc-500"
                                    }`}
                                  >
                                    {i + 1}
                                  </span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                      <div className="card-paper rounded-2xl border border-amber-200 p-3 shadow-sm sm:p-4">
                        <div className="mb-2 text-xs font-bold uppercase tracking-wider text-amber-700">Pantry shelf</div>
                        <div className="grid grid-cols-3 gap-2">
                          {pantry.map((id) => (
                            <button
                              key={id}
                              onClick={() => tryIngredient(id)}
                              className={`btn-soft flex flex-col items-center gap-1 rounded-2xl p-2 hover:-translate-y-0.5 ${
                                shakeId === id ? "anim-shake !border-red-400" : ""
                              }`}
                            >
                              <IngredientGlyph id={id} className="h-11 w-11" />
                              <span className="text-[11px] font-bold text-amber-900">
                                {INGREDIENTS.find((i) => i.id === id)?.name}
                              </span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  {phase === "cook" && <CookPanel cook={cook} cooking={cooking} toggleIron={toggleIron} />}

                  {phase === "serve" && (
                    <ServePanel order={order} toppings={toppings} addTopping={addTopping} serve={serve} />
                  )}

                  {phase === "table" && (
                    <TablePanel patience={patience} doneness={doneness} toppings={toppings} serveTable={serveTable} />
                  )}

                  {phase === "delivery" && (
                    <DeliveryPanel
                      road={road}
                      street={street}
                      warmth={warmth}
                      blocksLeft={blocksLeft}
                      cooldown={cooldown}
                      pedal={pedal}
                      hazard={hazard}
                      hazardLeft={hazardLeft}
                      dodge={dodgeHazard}
                    />
                  )}
                </section>
              </div>
            </div>
          </div>
        );
      }

      function Panel({ children }) {
        return (
          <div className="shop-bg flex min-h-[100dvh] w-full items-center justify-center px-4 py-10">
            <div className="card-paper flex w-full max-w-md flex-col items-center gap-5 rounded-3xl border border-amber-200 p-8 text-center shadow-2xl">
              {children}
            </div>
          </div>
        );
      }

      function MiniWaffle({ className }) {
        return (
          <svg viewBox="0 0 32 32" className={`select-none ${className || ""}`} aria-hidden="true">
            <rect x={1} y={1} width={30} height={30} rx={6} fill="#d39b2e" />
            {[0, 1, 2].map((r) =>
              [0, 1, 2].map((c) => {
                const x = 4 + c * 8;
                const y = 4 + r * 8;
                return <rect key={`${r}-${c}`} x={x} y={y} width={7} height={7} rx={1.6} fill="#f2c96a" />;
              })
            )}
          </svg>
        );
      }

      function CookPanel({ cook, cooking, toggleIron }) {
        const pct = Math.round(cook * 100);
        const inGolden = pct >= 38 && pct <= 60;
        return (
          <div className="flex flex-1 flex-col justify-center gap-4">
            <div className="card-paper rounded-2xl border border-amber-200 p-4 shadow-sm">
              <div className="mb-2 flex items-center justify-between text-xs font-bold uppercase tracking-wider text-amber-700">
                <span>Doneness</span>
                <span className={`rounded-full px-2 py-0.5 ${inGolden ? "bg-amber-200 text-amber-900" : "bg-amber-100 text-amber-700"}`}>
                  {pct}%
                </span>
              </div>
              <div
                className={`relative h-5 w-full overflow-hidden rounded-full border border-zinc-200 bg-zinc-100 ${
                  inGolden ? "ring-2 ring-amber-400 ring-offset-2 ring-offset-white" : ""
                }`}
              >
                {ZONES.map((z) => (
                  <div
                    key={z.label}
                    className="absolute top-0 h-full transition-colors first:rounded-l-full last:rounded-r-full"
                    style={{
                      left: `${z.from * 100}%`,
                      width: `${(z.to - z.from) * 100}%`,
                      backgroundColor: toppingColorForZone(z.label),
                      opacity: z.label === "GOLDEN" ? 0.95 : 0.55,
                    }}
                    title={z.label}
                  />
                ))}
                <div

      function TablePanel({ patience, doneness, toppings, serveTable }) {

      function TableScene({ patience, doneness, toppings, served }) {

      function RoadHazard({ type }) {

                      ? "bg-emerald-100 text-emerald-700"
                      : warmthPct >= 45
                      ? "bg-amber-100 text-amber-700"
                      : "bg-red-100 text-red-700"
                  }`}
                >
                  {warmthPct}%
                </span>
              </div>
              <div className="h-5 w-full overflow-hidden rounded-full border border-zinc-200 bg-zinc-100">
                <div
                  className={`h-full rounded-full bg-gradient-to-r ${warmColor} transition-all duration-150`}
                  style={{ width: `${warmthPct}%` }}
                />
              </div>
              <div className="mt-2 grid grid-cols-3 gap-1 text-center text-[10px] font-bold uppercase tracking-wide">
                <span className="rounded bg-emerald-500/15 px-1 py-0.5 text-emerald-700">70+ = $14</span>
                <span className="rounded bg-amber-400/25 px-1 py-0.5 text-amber-700">45+ = $8</span>
                <span className="rounded bg-red-500/15 px-1 py-0.5 text-red-700">20+ = $3</span>
              </div>
            </div>
            <RoadScene road={road} drive={drive} street={street} arrived={arrived} hazard={hazard} hazardLeft={hazardLeft} />
            {hazard ? (
              <button
                onClick={dodge}
                disabled={hazardLeft <= 0}
                className="btn-go rounded-full px-8 py-3 text-lg font-bold disabled:cursor-not-allowed disabled:opacity-40"
              >
                Dodge the {hazard}! (space)
              </button>
            ) : (
              <button
                onClick={pedal}
                disabled={!canPedal}
                className="btn-primary rounded-full px-8 py-3 text-lg font-bold disabled:cursor-not-allowed disabled:opacity-40"
              >
                {canPedal ? "Pedal! (space)" : "pedaling..."}
              </button>
            )}
            {!canPedal && !hazard && <p className="-mt-2 text-center text-xs text-amber-800/60">catching your breath...</p>}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<WaffleGame />);
    </script>
  </body>
</html>
